<style>
.gkft-wrap,.gkft-wrap *{ box-sizing:border-box; }
.gkft-wrap{

<script>
(function(){
  var w = document.getElementById('gkftWrap'), x = document.getElementById('gkftX');
  if (!w) return;
  w.classList.add('gkft-js');          /* JSが動くときだけスクロール表示に切り替える */
  var shown = false, closed = false;
  function check(){
    if (closed) return;
    var y = window.pageYOffset || document.documentElement.scrollTop;
    if (!shown && y > 400) { shown = true; w.hidden = false;
      requestAnimationFrame(function(){ w.classList.add('gkft-on'); }); }
  }
  x.addEventListener('click', function(){
    closed = true; w.classList.remove('gkft-on');
    setTimeout(function(){ w.hidden = true; }, 450);
  });
  window.addEventListener('scroll', check, { passive:true });
  check();
})();
</script>
